name: OIDC workflow
on:
    push:
        branches: [main]
        paths:
            - '.github/workflows/oidc.yml'
            - 'src/**'
            - '!**/*.md'
    workflow_dispatch:
permissions:
    id-token: write
    contents: read
jobs:
    inspect:
        name: Request OIDC token and inspect
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Request OIDC token
              id: get-oidc-token
              run: |
                JWT=$(curl -sSL \
                 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                 | jq -r '.value')
                echo "::add-mask::$JWT"
                echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
            - name: Decode OIDC claims
              env:
                JWT: ${{ steps.get-oidc-token.outputs.jwt }}
              run: |
                PAYLOAD=$(echo "$JWT" | cut -d. -f2)
                # base64url → base64 → jq
                PADDED=$(printf '%s' "$PAYLOAD" | tr '_-' '/+' )
                # pad to a multiple of 4
                while [ $(( ${#PADDED} % 4 )) -ne 0 ]; do PADDED="${PADDED}="; done
                CLAIMS=$(echo "$PADDED" | base64 -d | jq '.')
                echo "$CLAIMS"
                {
                    echo "### OIDC claims (no environment)"
                    echo '```json'
                    echo "$CLAIMS"
                    echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
    inspect-prod:
        name: Request OIDC token and inspect (prod)
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Request OIDC token
              id: get-oidc-token
              run: |
                JWT=$(curl -sSL \
                 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
                 | jq -r '.value')
                echo "::add-mask::$JWT"
                echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
            - name: Decode OIDC claims
              env:
                JWT: ${{ steps.get-oidc-token.outputs.jwt }}
              run: |
                PAYLOAD=$(echo "$JWT" | cut -d. -f2)
                # base64url → base64 → jq
                PADDED=$(printf '%s' "$PAYLOAD" | tr '_-' '/+' )
                # pad to a multiple of 4
                while [ $(( ${#PADDED} % 4 )) -ne 0 ]; do PADDED="${PADDED}="; done
                CLAIMS=$(echo "$PADDED" | base64 -d | jq '.')
                echo "$CLAIMS"
                {
                    echo "### OIDC claims (prod environment)"
                    echo '```json'
                    echo "$CLAIMS"
                    echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                