name: matrix
on: [push, workflow_dispatch]
jobs:
    check:
        name: check (node=${{ matrix.node }}, os=${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                node: [20, 22]
                os: [ubuntu-latest, macos-latest]
                exclude:
                    - node: 22
                      os: macos-latest
                include:
                    - node: 20
                      os: ubuntu-latest
                      label: "canary"
        runs-on: ${{ matrix.os }}
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
          - name: Setup node
            uses: actions/setup-node@v4
            with:
              node-version: ${{ matrix.node }}
          - name: Print environment
            run: echo "Running on ${{ matrix.os }} with Node ${{ matrix.node }}"
          - name: Canary marker
            if: ${{ matrix.label == 'canary' }}
            run: echo "This is the canary build"
            