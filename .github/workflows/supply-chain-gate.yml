name: Supply Chain Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write        # OIDC for cosign keyless
  packages: write        # push image to ghcr

jobs:
  build-sign-scan:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/hello-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (records digest as an output)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true      # SLSA provenance attestation, automatic
          sbom: true            # SPDX SBOM attestation, automatic

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless sign: no private key. Cosign fetches an OIDC token from
      # id-token: write, exchanges it at Fulcio for a short-lived cert.
      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX JSON)
        run: |
          syft "${IMAGE}@${{ steps.build.outputs.digest }}" \
            -o spdx-json=sbom.spdx.json

      - name: Attach SBOM as signed attestation
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Trivy scan (gate on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Supply-chain gate"
            echo ""
            echo "- image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- signed: yes (keyless via Fulcio)"
            echo "- SBOM attestation: attached (SPDX)"
            echo "- trivy: no HIGH/CRITICAL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Downstream verification. Runs on a separate job to prove the artifact
  # is verifiable using ONLY the digest + identity claims — no secrets shared.
  verify:
    runs-on: ubuntu-latest
    needs: build-sign-scan
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Verify signature by workflow identity
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/supply-chain-gate.yml@.*" \
            --certificate-oidc-issuer      "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/hello-app@${{ needs.build-sign-scan.outputs.digest }}" \
          || cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer      "https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ github.repository }}/hello-app:${{ github.sha }}"
