name: hello
on:
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/workflows/hello.yml'
      - 'src/**'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hello.yml'
      - 'src/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      message:
        type: string
        description: 'Your message'
        required: true
        default: 'Hello'
      shout:
        type: boolean
        description: 'Shout the message'
        required: false
        default: false
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print a greeting
        run: |
          MSG="${GREETING:-Hello from GHA} $REF_NAME"
          if [ "$SHOUT" = "true" ]; then
            echo "$MSG" | tr '[:lower:]' '[:upper:]'
          else
            echo "$MSG"
          fi
        env:
          REF_NAME: ${{ github.ref_name }}
          GREETING: ${{ inputs.message }}
          SHOUT: ${{ inputs.shout }}
  farewell:
    runs-on: ubuntu-latest
    needs: greet
    steps:
      - name: Print a farewell
        run: echo "Goodbye from GHA $REF_NAME"
        env:
          REF_NAME: ${{ github.ref_name }}